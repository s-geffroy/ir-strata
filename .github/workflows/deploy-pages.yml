name: Deploy Docusaurus to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm install

      - name: Check data integrity (offline gates)
        run: npm run check:data

      - name: Audit references (real existence, network)
        run: npm run audit:refs

      - name: Generate paper LaTeX wrapper
        run: python3 scripts/generate_paper_tex.py

      - name: Compile paper PDF
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: paper

      - name: Publish paper PDF to static
        run: |
          mkdir -p static/paper
          cp paper/main.pdf static/paper/strates_ri_chemin_a.pdf

      - name: Build site
        env:
          ORGANIZATION_NAME: ${{ github.repository_owner }}
          PROJECT_NAME: ${{ github.event.repository.name }}
        run: npm run build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
